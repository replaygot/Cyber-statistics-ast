name: mapdata

# Разовый сбор данных для карты клубов (только чтение). Результат — в ветке map-data-output.
on:
  push:
    branches: [map-data]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mapdata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: python3 mapdata/fetch.py out

      - name: Publish output to map-data-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          mkdir -p out
          echo "run: ${{ github.run_id }} at $(date -u +%FT%TZ)" > out/RUN.txt
          git checkout --orphan map-data-output
          git rm -r -q --cached .
          git add -f out
          git commit -q -m "Map data, run ${{ github.run_id }}"
          git push -f origin map-data-output
