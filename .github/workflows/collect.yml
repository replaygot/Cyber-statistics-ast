name: collect

# Раз в час записывает занятость мест LORAN в data/<код клуба>/occupancy.csv.
# Время в cron — UTC: 40-я минута каждого часа, чтобы окно брони начиналось ровно в начале часа.
on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  CLUB_HASH: 1jelye8o
  COLLECT_UNTIL: "2026-11-13T12:00:00+05:00"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect occupancy
        run: python3 collector/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Нет новых данных"; exit 0; fi
          git commit -q -m "data: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
