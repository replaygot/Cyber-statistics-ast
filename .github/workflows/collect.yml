name: collect

# Раз в час записывает занятость мест клубов в data/<код клуба>/.
# Каждый час (около :35) сбор запускает запланированная задача Claude через workflow_dispatch.
# Расписание GitHub ниже срабатывает редко и с опозданием, оставлено как запасное.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Запуски сбора идут строго по одному: следующий ждёт, пока предыдущий не отправит данные.
# Отменять идущий запуск нельзя — потеряются его замеры.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  # Коды клубов из ссылок booking.langame.ru/<код>, через пробел. 1jelye8o — LORAN.
  # С 10.11 — все 22 клуба Астаны с онлайн-бронью в каталоге langame.ru (кроме них онлайн-брони ни у кого нет).
  CLUBS: >-
    1jelye8o 1JB6NB4A 16Xp6Rly bKqXNKEG 1JB6N7pB kywedwxo krKEyOPv kgGamr9N
    YQlqXEaP bVJnDE0Q bLxgN4B5 1JB6Nawe YwQ7AOma YNo8l6DA kO5VxXZy
    1avrAZ8r bAaJQgP9 YZPKeGgN 12O49yj2 b56KpWW7 16Xp6WAL b7g5XPAd
  COLLECT_UNTIL: "2026-11-21T12:00:00+05:00"
  # Клубы опрашиваются в STREAMS потоков: внутри потока — по очереди с паузой, внутри клуба — пауза
  # между запросами. 22 клуба в 3 потока — около 3,5–4 минут на запуск, чтобы сбор до 21.11 уложился
  # в 2000 бесплатных минут GitHub Actions в месяц (минуты считаются по времени задачи, а не потоков).
  # Каждый клуб пишет только в свою папку data/<код>, поэтому потоки друг другу не мешают.
  STREAMS: "3"
  CLUB_PAUSE_S: "15"
  REQUEST_PAUSE_S: "2"
  # Сколько секунд на клуб можно повторять запросы, если сервис не отвечает.
  RETRY_BUDGET_S: "150"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ref: main — брать main на момент старта задачи, а не коммит, на котором запуск был поставлен в очередь.
      # Иначе запуск, ждавший в очереди concurrency, стартует со старого коммита без замеров предыдущего
      # запуска и при push упирается в конфликт в occupancy.csv и SUMMARY.md.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect occupancy
        run: |
          set -u
          mkdir -p /tmp/logs
          clubs=($CLUBS)
          stream() {
            local i=$1 first=1 failed=0
            for ((k=i; k<${#clubs[@]}; k+=STREAMS)); do
              [ "$first" = 1 ] || sleep "$CLUB_PAUSE_S"
              first=0
              echo "== ${clubs[$k]}"
              CLUB_HASH="${clubs[$k]}" python3 collector/collect.py 2>&1 || { failed=1; echo "!! ${clubs[$k]} не собран"; }
            done
            return $failed
          }
          pids=()
          for ((i=0; i<STREAMS; i++)); do
            stream "$i" > "/tmp/logs/stream$i.log" &
            pids+=($!)
            sleep 3
          done
          failed=0
          for p in "${pids[@]}"; do wait "$p" || failed=1; done
          for ((i=0; i<STREAMS; i++)); do echo "### поток $i"; cat "/tmp/logs/stream$i.log"; done
          grep -h "^!!" /tmp/logs/*.log || true
          exit $failed

      - name: Commit data
        if: always()
        # Отправка с повторами; при конфликте в occupancy.csv/SUMMARY.md они пересобираются из raw поверх свежего main.
        run: bash collector/commit_data.sh
