name: collect

# Раз в час записывает занятость мест клубов в data/<код клуба>/.
# Cron в UTC: 40-я минута каждого часа (в Астане тоже :40), чтобы окно брони начиналось в начале часа.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  # Коды клубов из ссылок booking.langame.ru/<код>, через пробел. 1jelye8o — LORAN.
  CLUBS: "1jelye8o"
  COLLECT_UNTIL: "2026-11-13T12:00:00+05:00"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect occupancy
        run: |
          failed=0
          for club in $CLUBS; do
            echo "== $club"
            CLUB_HASH="$club" python3 collector/collect.py || failed=1
          done
          exit $failed

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Нет новых данных"; exit 0; fi
          git commit -q -m "data: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
