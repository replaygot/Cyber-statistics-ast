name: discover

# Разовая разведка: открывает страницу бронирования и сохраняет, что она загружает.
# Результат публикуется в ветку discovery-output.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "discover/**"
      - ".github/workflows/discover.yml"

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Run discovery
        continue-on-error: true
        run: python discover/discover.py out

      - name: Publish output to discovery-output branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          mkdir -p out
          echo "run: ${{ github.run_id }} at $(date -u +%FT%TZ)" > out/RUN.txt
          git checkout --orphan discovery-output
          git rm -r -q --cached .
          git add -f out
          git commit -q -m "Discovery output, run ${{ github.run_id }}"
          git push -f origin discovery-output
